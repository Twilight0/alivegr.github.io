title: AliveGR
description: >-
  AliveGR — your one Kodi addon for everything Greek: live TV, movies, series, sports, music, kids and more.
url: "https://alivegr.app"
baseurl: ""

# Clean content URLs
permalink: /news/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Whitelisted on GitHub Pages: RSS feed + sitemap
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Don't publish repo meta files to the live site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "en"
      type: pages
    values:
      layout: default
      lang: en
  - scope:
      path: "el"
      type: pages
    values:
      layout: default
      lang: el
