<div class="intro-section">
    <h2>Choose your language / Επιλέξτε γλώσσα</h2>
</div>

<div class="lang-gateway">
    <a class="lang-card" href="/en/">
        <h2>English</h2>
        <p>Continue to the English version of the AliveGR site.</p>
    </a>
    <a class="lang-card" href="/el/">
        <h2>Ελληνικά</h2>
        <p>Συνεχίστε στην ελληνική έκδοση του ιστότοπου AliveGR.</p>
    </a>
</div>

<script>
(function () {
    try {
        if (window.location.pathname !== '/') return;
        var pref = (navigator.language || 'en').toLowerCase();
        if (pref.indexOf('el') === 0) window.location.replace('/el/');
        else window.location.replace('/en/');
    } catch (e) { /* stay on gateway */ }
})();
</script>
